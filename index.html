<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEDUR — Loading</title>
  <link rel="stylesheet" href="css/loader.css">
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader__stage" id="stage">

      <!-- Collage images (positions from Figma, 1440×800 canvas) -->
      <div class="tile tile--53" data-tile>
        <img src="assets/loader/image-53.png" alt="">
      </div>
      <div class="tile tile--56" data-tile>
        <img src="assets/loader/image-56.png" alt="">
      </div>
      <div class="tile tile--58" data-tile>
        <img src="assets/loader/image-58.png" alt="">
      </div>
      <div class="tile tile--52" data-tile>
        <img src="assets/loader/image-52.png" alt="">
      </div>
      <div class="tile tile--54" data-tile>
        <img src="assets/loader/image-54.png" alt="">
      </div>

      <!-- Center image: grows 375×356 → 637×356 → 1000×559, then the video starts -->
      <div class="hero" id="hero">
        <video id="heroVideo" src="assets/loader/video-cedur.mp4"
               poster="assets/loader/hero-house.png"
               muted playsinline preload="auto"></video>
      </div>

      <!-- LOADING wordmark (kinetic video, text fallback) -->
      <div class="loading-mark" id="loadingMark">
        <video src="assets/loader/loading-kinetic.mp4" muted playsinline autoplay loop
               onerror="this.remove(); document.getElementById('loadingMark').classList.add('loading-mark--text')"></video>
        <span class="loading-mark__fallback" aria-hidden="true">LO<b>&#9650;</b>DING</span>
      </div>

    </div>
  </div>

  <script src="js/loader.js"></script>
</body>
</html>
